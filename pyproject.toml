[project]
name = "model-deployment"
version = "0.1.0"
description = "Cheese App: package a trained classifier and deploy it to a Vertex AI endpoint"
readme = "README.md"
requires-python = ">=3.11,<3.12"  # matches the Dockerfile base image (python:3.11)
dependencies = [
    "google-cloud-aiplatform>=1.121.0",
    "requests>=2.32.5",
    "tensorflow==2.17.0",
    "wrapt<2",  # wrapt 2.x breaks tf.saved_model.save (_DictWrapper TypeError)
]
